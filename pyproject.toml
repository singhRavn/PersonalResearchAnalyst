[project]
name = "personal-research-analyst"
version = "0.1.0"
description = "A production-grade cognitive agent system for autonomous research"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Principal Engineer", email = "engineer@example.com"}
]
keywords = ["ai", "agent", "research", "cognitive", "mcp", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.0",
    "tavily-python",
    "ddgs",
    "crawl4ai",
    "python-dotenv",
    "openai",
    "mcp",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]